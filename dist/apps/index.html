<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="assets/replica.css" />
</head>

<body>
  <div id="root"></div>
  <div id="overlay-layer" class="overlay-layer"></div>
  <div id="toast-layer" class="toast-layer"></div>
  <script>
    window.__errors = [];
    window.addEventListener("error", function (e) {
      window.__errors.push(String(e.message) + " @" + (e.filename || "") + ":" + (e.lineno || 0));
    });
    window.addEventListener("unhandledrejection", function (e) {
      window.__errors.push("unhandled: " + String(e.reason));
    });
  </script>
  <script src="assets/icons.js"></script>
  <script src="assets/mock-api.js"></script>
  <script src="assets/mock-stream.js"></script>
  <script src="assets/app.js"></script>
</body>

</html>
